name: Build and push image (rma branch)

on:
  push:
    branches:
      - rma

env:
  IMAGE: quay.io/assisted-migration/standalone-ui
  IMAGE_TAG: rma

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build container image
        run: make podman-build
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      - name: Push to Quay.io
        run: make podman-push
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          QUAY_USER: ${{ secrets.QUAY_ASSISTED_MIGRATION_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_ASSISTED_MIGRATION_TOKEN }}
