name: Build and push image (rma branch)

on:
  push:
    branches:
      - rma

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: quay.io/assisted-migration/standalone-ui
      IMAGE_TAG: rma-${{ github.sha }}
      QUAY_USER: ${{ secrets.QUAY_ASSISTED_MIGRATION_USER }}
      QUAY_TOKEN: ${{ secrets.QUAY_ASSISTED_MIGRATION_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Build container image
        run: make podman-build

      - name: Login to Quay.io
        run: make quay-login

      - name: Push image to Quay.io
        run: make podman-push